{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:380px;margin:50px auto">
  <div class="card">
    <h2 style="text-align:center;margin-bottom:16px">TransferDB Login</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" style="width:100%;margin-top:8px">Login</button>
    </form>
    <hr>
    <p style="text-align:center;font-size:13px">
      Don't have an account?
      <a href="{{ url_for('auth.signup') }}" style="color:#2d572c;font-weight:600">Sign up here</a>
    </p>
  </div>
</div>
{% endblock %}
