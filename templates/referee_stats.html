{% extends 'base.html' %}
{% block title %}Referee Statistics{% endblock %}
{% block content %}
<h1>My Officiating Statistics</h1>

<div class="dashboard-grid">
  <div class="stat-box">
    <div class="stat-num">{{ stats.matches_officiated or 0 }}</div>
    <div class="stat-label">Matches Officiated</div>
  </div>
  <div class="stat-box">
    <div class="stat-num">{{ stats.total_yellow or 0 }}</div>
    <div class="stat-label">Yellow Cards Issued</div>
  </div>
  <div class="stat-box">
    <div class="stat-num">{{ stats.total_red or 0 }}</div>
    <div class="stat-label">Red Cards Issued</div>
  </div>
</div>
{% endblock %}
