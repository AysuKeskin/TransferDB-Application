{% extends 'base.html' %}
{% block title %}Sign Up – Player{% endblock %}
{% block content %}
<div style="max-width:520px;margin:40px auto">
  <div class="card">
    <h1 style="margin-top:0">Player Registration</h1>
    <form method="POST" action="{{ url_for('auth.signup_player') }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" value="{{ form.get('username','') }}" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
        <small style="color:#777">Min 8 chars, uppercase, lowercase, digit, special char</small>
      </div>
      <hr>
      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="name" value="{{ form.get('name','') }}" required>
      </div>
      <div class="form-group">
        <label>Surname</label>
        <input type="text" name="surname" value="{{ form.get('surname','') }}" required>
      </div>
      <div class="form-group">
        <label>Nationality</label>
        <input type="text" name="nationality" value="{{ form.get('nationality','') }}" required>
      </div>
      <div class="form-group">
        <label>Date of Birth (YYYY-MM-DD)</label>
        <input type="date" name="date_of_birth" value="{{ form.get('date_of_birth','') }}" required>
      </div>
      <div class="form-group">
        <label>Market Value (€)</label>
        <input type="number" name="market_value" step="0.01" min="0.01"
               value="{{ form.get('market_value','') }}" required>
      </div>
      <div class="form-group">
        <label>Main Position</label>
        <select name="main_position" required>
          <option value="">-- Select --</option>
          {% for pos in ['Goalkeeper','Defender','Midfielder','Forward'] %}
            <option value="{{ pos }}"
              {{ 'selected' if form.get('main_position','') == pos }}>{{ pos }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Strong Foot</label>
        <select name="strong_foot" required>
          <option value="">-- Select --</option>
          {% for foot in ['Right','Left','Both'] %}
            <option value="{{ foot }}"
              {{ 'selected' if form.get('strong_foot','') == foot }}>{{ foot }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Height (cm)</label>
        <input type="number" name="height" min="1"
               value="{{ form.get('height','') }}" required>
      </div>
      <button type="submit" style="width:100%;margin-top:12px">Register as Player</button>
    </form>
    <p style="text-align:center;font-size:13px;margin-top:10px">
      <a href="{{ url_for('auth.signup') }}">&larr; Back to role selection</a>
    </p>
  </div>
</div>
{% endblock %}
