{% extends 'base.html' %}
{% block title %}Register Transfer{% endblock %}
{% block content %}
<h1>Register Transfer & Contract</h1>
<div class="card">
  <form method="POST">
    <div class="form-group">
      <label for="player_id">Player</label>
      <select id="player_id" name="player_id" required>
        <option value="">-- Select Player --</option>
        {% for p in players %}
        <option value="{{ p.person_id }}"
          {{ 'selected' if form.get('player_id')==p.person_id|string }}>
          {{ p.name }} {{ p.surname }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="dest_club_id">Destination Club</label>
      <select id="dest_club_id" name="dest_club_id" required>
        <option value="">-- Select Club --</option>
        {% for c in clubs %}
        <option value="{{ c.club_id }}"
          {{ 'selected' if form.get('dest_club_id')==c.club_id|string }}>
          {{ c.club_name }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="contract_type">Contract Type</label>
      <select id="contract_type" name="contract_type" required>
        <option value="Permanent" {{ 'selected' if form.get('contract_type')=='Permanent' }}>Permanent</option>
        <option value="Loan" {{ 'selected' if form.get('contract_type')=='Loan' }}>Loan</option>
      </select>
    </div>
    <div class="form-group">
      <label for="salary">Weekly Salary</label>
      <input type="number" id="salary" name="salary" step="0.01" min="0"
             value="{{ form.get('salary','') }}" required>
    </div>
    <div class="form-group">
      <label for="transfer_fee">Transfer Fee</label>
      <input type="number" id="transfer_fee" name="transfer_fee" step="0.01" min="0"
             value="{{ form.get('transfer_fee','') }}" required>
    </div>
    <div class="form-group">
      <label for="end_date">Contract End Date</label>
      <input type="date" id="end_date" name="end_date"
             value="{{ form.get('end_date','') }}" required>
    </div>
    <button type="submit">Register Transfer</button>
    <a href="{{ url_for('dbmanager.dbmanager_dashboard') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
